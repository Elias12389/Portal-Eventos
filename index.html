<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/style.css" />
    <title>Portal de eventos</title>
  </head>
  <body>
    <nav>
      <h1 class="text-white">Portal de eventos</h1>
      <ul>
        <li>
          <a href="#" data-view="dashboard">Dashboard</a>
        </li>
        <li><a href="#" data-view="novo">Novo Evento</a></li>
        <li><a href="#" data-view="eventos">Eventos</a></li>
      </ul>
    </nav>

    <main id="app">
      <div id="dashboard" class="tela"></div>

      <div id="novo" class="tela text-center">
        <h2>Criar Novo Evento</h2>
        <form id="cadastroEventos" class="text-start border-black w-50">
          <label for="titulo">Titulo</label>
          <input
            type="text"
            id="titulo"
            placeholder="Digite o título do evento"
            required
          />

          <label for="tipo">Tipo</label>
          <input
            type="text"
            id="tipo"
            placeholder="Digite o tipo do Evento"
            required
          />

          <label for="data">Data</label>
          <input type="date" id="data" required />

          <label for="local">Local</label>
          <input
            type="text"
            id="local"
            placeholder="Digite o local do evento"
            required
          />

          <label for="descricao">Descrição</label>
          <textarea
            id="descricao"
            placeholder="Digite a descrição do evento"
            required
          ></textarea>

          <button type="submit" class="mt-3">Cadastrar Evento</button>
        </form>
      </div>

      <div id="eventos" class="tela">
        <h2>Eventos Cadastrados</h2>

        <div id="containerEventos" class="d-flex flex-wrap gap-3 mt-3"></div>
      </div>
    </main>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="js/app.js"></script>
  </body>
</html>
